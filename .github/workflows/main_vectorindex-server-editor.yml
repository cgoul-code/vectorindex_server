name: Build and deploy Python app to Azure Web App - vectorindex-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Ingen venv, ingen pip install her – det er kun for deploy-pakke
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            # Ikke send unødvendig drit
            .git/
            .github/
            __pycache__/
            *.pyc
            node_modules/
            venv/
            antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vectorindex-server-editor'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A462A6E3BD4748D88B6AF1E6B1FDBAC1 }}
          package: .


